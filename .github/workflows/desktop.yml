name: Build Desktop (Windows)

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        shell: bash
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Bundle libVLC
        shell: pwsh
        run: |
          $ver = "3.0.21"
          curl.exe -L -o vlc.zip "https://get.videolan.org/vlc/$ver/win64/vlc-$ver-win64.zip"
          Expand-Archive vlc.zip -DestinationPath vlctmp -Force
          $src = Get-ChildItem vlctmp -Directory | Select-Object -First 1
          $dst = "appResources/windows/vlc"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$($src.FullName)/libvlc.dll" $dst
          Copy-Item "$($src.FullName)/libvlccore.dll" $dst
          Copy-Item "$($src.FullName)/plugins" $dst -Recurse
          "libVLC встроен: $((Get-ChildItem -Recurse $dst | Measure-Object -Property Length -Sum).Sum / 1MB) МБ"

      - name: Build portable app and installer
        shell: bash
        run: ./gradlew createDistributable packageDistributionForCurrentOS --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed" -A3 build.log | head -60 || true

      - name: Collect artifacts
        if: success()
        shell: bash
        run: |
          mkdir -p out
          # Портативная версия: папка с готовым AkkMusic.exe, запускается без установки
          appdir=$(find build/compose/binaries -type d -name AkkMusic -path "*/app/*" | head -1)
          if [ -n "$appdir" ]; then
            powershell -Command "Compress-Archive -Path '$appdir\\*' -DestinationPath 'out\\AkkMusic-portable-${APP_VERSION}.zip' -Force"
          fi
          # Установщик (ставит в меню Пуск)
          find build/compose/binaries -type f -name "*.msi" -exec cp {} out/ \;
          ls -la out

      - name: Publish release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          notes=$(git log -1 --format=%s)
          gh release create "desktop-v$V" out/* \
            --title "AkkMusic Desktop $V" \
            --notes "$notes" \
            --target "${{ github.sha }}"
