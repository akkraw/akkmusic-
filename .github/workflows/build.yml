name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      # Если сборка упала — показываем ошибки компиляции прямо на странице сборки
      - name: Show errors
        if: failure()
        run: |
          errs=$(grep -E "^e: |error:|What went wrong|AAPT|Could not" -A2 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${errs}"

      # Публикуем релиз с APK: вкладка Releases на главной странице репозитория
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/*.apk "AkkMusic-${VERSION}.apk"
          git log -1 --format=%B > notes.md
          gh release create "v${VERSION}" "AkkMusic-${VERSION}.apk" \
            --title "AkkMusic ${VERSION}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --latest
