name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Номер беты: 0.9.1 … 0.9.9, дальше 0.9.9.1, 0.9.9.2 …
      # Считается по уже выпущенным бета-релизам, поэтому упавшие сборки номер не съедают.
      - name: Version
        run: |
          n=$(( $(git tag -l 'v0.9.*' | wc -l) + 1 ))
          if [ "$n" -le 9 ]; then v="0.9.$n"; else v="0.9.9.$((n - 9))"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "Версия: Beta $v"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      # Если сборка упала — показываем ошибки компиляции прямо на странице сборки
      - name: Show errors
        if: failure()
        run: |
          errs=$(grep -E "^e: |error:|What went wrong|AAPT|Could not" -A2 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${errs}"

      # Публикуем релиз с APK: вкладка Releases на главной странице репозитория
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_NAME}"
          cp app/build/outputs/apk/release/*.apk "AkkMusic-${VERSION}-beta.apk"
          git log -1 --format=%B | grep -v -E "^(Co-Authored-By|Claude-Session):" > notes.md
          gh release create "v${VERSION}" "AkkMusic-${VERSION}-beta.apk" \
            --title "AkkMusic Beta ${VERSION}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --latest
